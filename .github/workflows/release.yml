name: Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag to build and attach
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.CLOUDSYNC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CLOUDSYNC_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.CLOUDSYNC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOUDSYNC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE" ] || missing+=("CLOUDSYNC_KEYSTORE_BASE64")
          [ -n "$STORE_PASSWORD" ] || missing+=("CLOUDSYNC_KEYSTORE_PASSWORD")
          [ -n "$ALIAS" ] || missing+=("CLOUDSYNC_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("CLOUDSYNC_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Release signing is not configured. Missing: ${missing[*]}"
            echo "Debug CI does not need these secrets. See docs/github-actions.md."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "CLOUDSYNC_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "CLOUDSYNC_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CLOUDSYNC_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "CLOUDSYNC_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Checksum
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          cp "$APK" "cloudsync-${TAG}.apk"
          sha256sum "cloudsync-${TAG}.apk" > SHA256SUMS
          echo "tag ${TAG}" >> SHA256SUMS
          echo "commit ${GITHUB_SHA}" >> SHA256SUMS
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: >
          gh release upload "$TAG"
          "cloudsync-${TAG}.apk"
          SHA256SUMS
          --clobber
